# ============================================================================
# noPDE control for coarse8_t9_25_t10_512p_zusatz: the same run, but
# the physics losses are NEVER switched on — pure data loss for all 360 epochs.
#
# This is a small overlay: the Hydra defaults list below pulls in the parent
# config wholesale (model, dataset, optimizer, wandb project, paths.yaml),
# and only what defines the control is overridden here. The weight schedule
# collapses to a single ramp-free 360-epoch phase (data_weight stays 1,
# pde/constraint stay 0), and use_pde_loss / use_constraint_loss are switched
# off so the PDE-residual and div-B terms are not even computed.
#
# 360 epochs = 0.6 x 600, the same ~23/38 rescale the parent's whole schedule
# uses for the enlarged (zusatz) dataset, so this control is samples-matched
# to the 600-epoch noPDE controls of the 23-sim runs.
#
# Same seed as the parent, so the first 60 epochs replicate the parent's
# data-only warm-up; from there this run shows where pure data training goes
# instead of the physics ramp.
#
# Launched by
# launchers_noPDE/run_coarse8_t9_25_t10_512p_zusatz_noPDE.sh.
# ============================================================================

defaults:
  - coarse8_t9_25_t10_512p_zusatz  # parent run: everything not
  - _self_                                   # overridden below comes from it

loss_params:
  # Physics off for the whole run: skip computing the PDE-residual and div-B
  # constraint terms entirely (their weights would stay 0 anyway).
  use_pde_loss: False
  use_constraint_loss: False
  # One ramp-free phase: all weights keep their starting values (data 1,
  # pde 0, constraint 0) for the entire run. Replaces the parent's schedule.
  weight_schedule:
    - epochs: 360

train_params:
  epochs: 360
  ckpt_path: ${output_root}/checkpoints/coarse8_t9_25_t10_512p_zusatz_noPDE

wandb_params:
  # Same wandb project as the parent (inherited); only the group is suffixed.
  wandb_group: coarse8_t9_25_t10_512p_zusatz_noPDE
